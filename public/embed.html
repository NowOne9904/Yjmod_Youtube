<!-- ====================================================
     YJ SHORTS EMBED - 자사몰 어드민에 붙여넣는 코드
     ==================================================== -->

<!-- CSS -->
<style>
/* ── 리셋 & 기본 ── */
.yj-wrap{width:100%;max-width:1200px;margin:0 auto;font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;color:#1a1a1a;position:relative;padding:0 4px}
.yj-wrap *{box-sizing:border-box}

/* ── 상단 프로그레스 바 ── */
.yj-progress{position:absolute;top:0;left:0;right:0;height:2px;background:#f0f0f0;border-radius:2px;overflow:hidden;z-index:99}
.yj-progress-inner{height:100%;width:30%;background:linear-gradient(90deg,#e53935,#ff6d00);border-radius:2px;animation:yj-prog 1.4s ease-in-out infinite}
@keyframes yj-prog{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.yj-progress.done .yj-progress-inner{width:100%;animation:none;transition:opacity .5s .3s}
.yj-progress.done{opacity:0;transition:opacity .5s .5s}

/* ── 헤더 ── */
.yj-header{padding:8px 0 20px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #f0f0f0;margin-bottom:24px}
.yj-header-left{display:flex;flex-direction:column;gap:4px}
.yj-title{font-size:22px;font-weight:800;color:#1a1a1a;margin:0;line-height:1.3;letter-spacing:-.3px}
.yj-title em{font-style:normal;color:#e53935;font-weight:900}
.yj-sub{font-size:12px;color:#999;margin:0;display:flex;align-items:center;gap:6px;font-weight:400}
.yj-sub-dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block;animation:yj-blink 2s ease infinite}
@keyframes yj-blink{0%,100%{opacity:1}50%{opacity:.3}}
.yj-channel-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#888;background:#f7f7f7;border:1px solid #eee;border-radius:6px;padding:4px 10px;font-weight:600;white-space:nowrap}

/* ── 그리드 ── */
.yj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ── 카드 ── */
.yj-card{
  display:flex;flex-direction:column;
  background:#fff;border-radius:12px;overflow:hidden;
  border:1px solid #eaeaea;
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s cubic-bezier(.22,1,.36,1);
  opacity:0;transform:translateY(20px);
  animation:yj-fade-in .5s cubic-bezier(.22,1,.36,1) forwards;
}
.yj-card:nth-child(1){animation-delay:0s}
.yj-card:nth-child(2){animation-delay:.06s}
.yj-card:nth-child(3){animation-delay:.12s}
.yj-card:nth-child(4){animation-delay:.18s}
@keyframes yj-fade-in{to{opacity:1;transform:translateY(0)}}
.yj-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12)}

/* 비디오 */
.yj-video{width:100%;aspect-ratio:9/16;background:#0a0a0a;position:relative;overflow:hidden}
.yj-video iframe{width:100%;height:100%;border:none}
.yj-watermark{position:absolute;bottom:8px;right:10px;color:rgba(255,255,255,.5);font-weight:800;font-size:11px;letter-spacing:1.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;z-index:9}

/* 제품 영역 */
.yj-prod{display:flex;flex-direction:column;flex-grow:1}
.yj-prod-body{display:flex;padding:12px;gap:10px;align-items:center;flex-grow:1}
.yj-prod-thumb{width:48px;height:48px;border-radius:8px;border:1px solid #f0f0f0;overflow:hidden;flex-shrink:0;background:#fafafa}
.yj-prod-thumb img{width:100%;height:100%;object-fit:contain}
.yj-prod-detail{display:flex;flex-direction:column;min-width:0;gap:2px}
.yj-prod-name{font-size:12px;font-weight:600;color:#333;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yj-prod-price-row{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.yj-prod-price{font-size:16px;font-weight:900;color:#e53935;letter-spacing:-.3px}

/* 버튼 */
.yj-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:#1a1a1a;color:#fff;
  padding:11px 0;font-weight:700;font-size:12px;
  text-decoration:none;letter-spacing:.3px;
  transition:background .25s;border-top:1px solid #f0f0f0;
}
.yj-btn:hover{background:#e53935}
.yj-btn-arrow{display:inline-block;font-size:10px;transition:transform .25s}
.yj-btn:hover .yj-btn-arrow{transform:translateX(3px)}

/* ── 스켈레톤 ── */
.yj-sk{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #eaeaea}
.yj-sk-v{width:100%;aspect-ratio:9/16;background:linear-gradient(180deg,#f5f5f5 0%,#ececec 100%);position:relative;overflow:hidden}
.yj-sk-body{display:flex;padding:12px;gap:10px;align-items:center}
.yj-sk-thumb{width:48px;height:48px;border-radius:8px;background:#f0f0f0;flex-shrink:0;position:relative;overflow:hidden}
.yj-sk-lines{flex:1;display:flex;flex-direction:column;gap:6px}
.yj-sk-line{height:10px;border-radius:5px;background:#f0f0f0;position:relative;overflow:hidden}
.yj-sk-line.s{width:55%}.yj-sk-line.m{width:75%}
.yj-sk-btn{height:40px;background:#f5f5f5;position:relative;overflow:hidden}

.yj-sk-v::after,.yj-sk-thumb::after,.yj-sk-line::after,.yj-sk-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,.6) 50%,transparent 75%);
  background-size:400% 100%;animation:yj-shim 1.8s ease infinite;
}
.yj-sk:nth-child(2) *::after{animation-delay:.1s}
.yj-sk:nth-child(3) *::after{animation-delay:.2s}
.yj-sk:nth-child(4) *::after{animation-delay:.3s}
@keyframes yj-shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 에러 ── */
.yj-error{padding:48px 20px;text-align:center;color:#bbb;font-size:13px;grid-column:1/-1}
.yj-error-ico{font-size:32px;margin-bottom:8px;opacity:.6}

/* ── 반응형 ── */
@media(max-width:1024px){.yj-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .yj-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .yj-title{font-size:18px}
  .yj-header{flex-direction:column;gap:8px}
  .yj-channel-tag{align-self:flex-start}
}
@media(max-width:420px){.yj-grid{grid-template-columns:1fr;max-width:320px;margin:0 auto}}
</style>

<!-- HTML -->
<div class="yj-wrap">

      <h2 class="yj-title">지금 뜨는 <em>추천 PC</em> 쇼츠</h2>

      <svg width="14" height="14" viewBox="0 0 24 24" fill="#e53935"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>

<!-- JavaScript -->
<script>
(function () {
  var API_URL = 'https://yjmod-youtube.vercel.app/api/latest-shorts';
  var CACHE_KEY = 'yj_shorts_v3';
  var CACHE_TTL = 6 * 60 * 60 * 1000;

  try { localStorage.removeItem('yj_shorts_v2'); } catch(e){}

  function setProgress(done) {
    var el = document.getElementById('yj-progress');
    if (el && done) el.classList.add('done');
  }

  function renderCards(data) {
    var grid = document.getElementById('yj-grid');
    if (!grid) { console.error('[YJ] grid not found'); return; }
    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="yj-error"><div class="yj-error-ico">📭</div>추천 PC 정보를 불러오지 못했습니다.</div>';
      setProgress(true);
      return;
    }
    grid.innerHTML = '';
    data.forEach(function (item) {
      var card = document.createElement('div');
      card.className = 'yj-card';
      var link = item.productLink || item.link;
      var thumb = item.productImage
        ? '<img src="' + item.productImage + '" alt="" loading="lazy">'
        : '<div style="font-size:9px;color:#ddd;text-align:center;line-height:48px">-</div>';
      var embed = 'https://www.youtube.com/embed/' + item.videoId
        + '?autoplay=1&mute=1&loop=1&playlist=' + item.videoId + '&rel=0&playsinline=1';
      card.innerHTML =
        '<div class="yj-video">' +
          '<iframe src="' + embed + '" title="' + (item.title || '') + '"' +
          ' frameborder="0" allow="autoplay;accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture"' +
          ' allowfullscreen loading="lazy"></iframe>' +
          '<div class="yj-watermark">YJ MOD</div>' +
        '</div>' +
        '<div class="yj-prod">' +
          '<div class="yj-prod-body">' +
            '<div class="yj-prod-thumb">' + thumb + '</div>' +
            '<div class="yj-prod-detail">' +
              '<div class="yj-prod-name">' + (item.productTitle || '') + '</div>' +
              '<div class="yj-prod-price-row">' +
                '<span class="yj-prod-price">' + (item.productPrice || '') + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<a href="' + link + '" target="_blank" class="yj-btn">제품 바로가기 <span class="yj-btn-arrow">→</span></a>' +
        '</div>';
      grid.appendChild(card);
    });
    setProgress(true);
  }

  function load() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && (Date.now() - c.ts) < CACHE_TTL && c.data && c.data.length > 0) {
        renderCards(c.data);
        return;
      }
    } catch (e) {}

    fetch(API_URL)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (d && d.length > 0) {
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: d })); } catch(e){}
        }
        renderCards(d);
      })
      .catch(function (e) {
        console.error('[YJ]', e);
        setProgress(true);
        var g = document.getElementById('yj-grid');
        if (g) g.innerHTML = '<div class="yj-error"><div class="yj-error-ico">⚠️</div>잠시 후 다시 시도해 주세요.</div>';
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
