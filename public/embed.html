<!-- ====================================================
     YJ SHORTS EMBED - 자사몰 어드민에 붙여넣는 코드
     ==================================================== -->

<!-- CSS -->
<style>
/* ── 기본 ── */
.yj-wrap{width:100%;max-width:1200px;margin:0 auto;font-family:'Inter','Noto Sans KR',sans-serif;color:#111;position:relative}

/* ── 상단 로딩 프로그레스 바 ── */
.yj-progress-bar{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#ff0000,#ff6b35);border-radius:0 3px 3px 0;z-index:99;transition:width .3s ease}
.yj-progress-bar.yj-progress-loading{animation:yj-progress-run 1.8s ease-in-out infinite}
@keyframes yj-progress-run{0%{width:0;left:0}60%{width:70%;left:0}100%{width:0;left:100%}}
.yj-progress-bar.yj-progress-done{width:100%;transition:width .4s ease}

/* ── LIVE 헤더 ── */
.yj-header{padding:4px 0 24px;display:flex;flex-direction:column;gap:12px}
.yj-live-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* LIVE 뱃지 — 크고 강렬하게 */
.yj-live-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:#ff0000;color:#fff;
  font-size:13px;font-weight:900;letter-spacing:3px;
  padding:5px 14px;border-radius:5px;
  box-shadow:0 0 0 0 rgba(255,0,0,.6);
  animation:yj-glow-pulse 1.5s ease-in-out infinite;
}
@keyframes yj-glow-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,.5)}
  50%{box-shadow:0 0 0 8px rgba(255,0,0,0)}
}
.yj-live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:yj-dot-blink 1s step-start infinite}
@keyframes yj-dot-blink{0%,100%{opacity:1}50%{opacity:0}}

/* "NEW" 뱃지 */
.yj-new-badge{display:inline-flex;align-items:center;background:linear-gradient(135deg,#ff6b35,#ff0000);color:#fff;font-size:10px;font-weight:900;letter-spacing:1px;padding:4px 10px;border-radius:20px}

/* 갱신 뱃지 */
.yj-update-badge{display:inline-flex;align-items:center;gap:5px;background:#f8f8f8;border:1px solid #e5e5e5;border-radius:20px;padding:4px 12px;font-size:11px;color:#666;font-weight:600}

/* 제목 */
.yj-title{font-size:28px;font-weight:900;color:#111;margin:0;line-height:1.2}
.yj-title span{
  background:linear-gradient(135deg,#ff0000,#ff6b35);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* 서브 */
.yj-sub{font-size:13px;color:#888;margin:0;display:flex;align-items:center;gap:7px}
.yj-sub-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;animation:yj-sub-pulse 2s ease-in-out infinite}
@keyframes yj-sub-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* ── 그리드 ── */
.yj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-top:4px}

/* ── 실제 카드 ── */
.yj-card{
  display:flex;flex-direction:column;
  background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  border:1px solid #f0f0f0;
  transition:transform .25s,box-shadow .25s;
  opacity:0;transform:translateY(16px);
  animation:yj-card-in .4s ease forwards;
}
.yj-card:nth-child(1){animation-delay:.05s}
.yj-card:nth-child(2){animation-delay:.12s}
.yj-card:nth-child(3){animation-delay:.19s}
.yj-card:nth-child(4){animation-delay:.26s}
@keyframes yj-card-in{to{opacity:1;transform:translateY(0)}}
.yj-card:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.14)}

/* 비디오 영역 */
.yj-video-wrap{width:100%;aspect-ratio:9/16;background:#000;position:relative;overflow:hidden}
.yj-video-wrap iframe{width:100%;height:100%;border:none}

/* 카드 내 LIVE 오버레이 뱃지 */
.yj-card-live{
  position:absolute;top:10px;left:10px;z-index:10;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,0,0,.9);backdrop-filter:blur(4px);
  color:#fff;font-size:9px;font-weight:900;letter-spacing:2px;
  padding:3px 8px;border-radius:4px;
}
.yj-card-live-dot{width:5px;height:5px;background:#fff;border-radius:50%;animation:yj-dot-blink 1s step-start infinite}

/* 워터마크 */
.yj-watermark{position:absolute;bottom:10px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.8);font-weight:900;font-size:14px;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.9);pointer-events:none;z-index:9}

/* 제품 정보 */
.yj-prod-info{display:flex;padding:14px 14px 10px;gap:10px;align-items:flex-start;flex-grow:1;border-left:3px solid #ff0000}
.yj-prod-thumb{width:52px;height:52px;border-radius:7px;border:1px solid #eee;overflow:hidden;flex-shrink:0}
.yj-prod-thumb img{width:100%;height:100%;object-fit:contain}
.yj-prod-texts{display:flex;flex-direction:column;justify-content:center;min-width:0}
.yj-prod-label{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.5px}
.yj-prod-title{font-size:12px;font-weight:700;color:#333;margin:3px 0 6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yj-prod-price{font-size:17px;font-weight:900;color:#ff0000;line-height:1}
.yj-prod-price-label{font-size:9px;font-weight:600;color:#ff6b35;letter-spacing:.5px;margin-bottom:1px}

/* 버튼 */
.yj-buy-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:#111;color:#fff;text-align:center;
  padding:13px 0;font-weight:700;font-size:13px;
  text-decoration:none;transition:background .2s,letter-spacing .2s;
  letter-spacing:.5px;
}
.yj-buy-btn:hover{background:#ff0000;letter-spacing:1.5px}
.yj-buy-arrow{display:inline-block;transition:transform .2s}
.yj-buy-btn:hover .yj-buy-arrow{transform:translateX(4px)}

/* ── 스켈레톤 ── */
.yj-skel{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #f0f0f0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.yj-skel-video{width:100%;aspect-ratio:9/16;background:#ebebeb;position:relative;overflow:hidden}
.yj-skel-info{display:flex;padding:14px;gap:10px;align-items:center;border-left:3px solid #f0f0f0}
.yj-skel-thumb{width:52px;height:52px;border-radius:7px;background:#ebebeb;flex-shrink:0;position:relative;overflow:hidden}
.yj-skel-lines{flex:1;display:flex;flex-direction:column;gap:7px}
.yj-skel-line{height:11px;border-radius:6px;background:#ebebeb;position:relative;overflow:hidden}
.yj-skel-line.w70{width:70%}.yj-skel-line.w50{width:50%}.yj-skel-line.w35{width:35%}
.yj-skel-btn{height:44px;background:#ebebeb;position:relative;overflow:hidden}

/* shimmer */
.yj-skel-video::after,.yj-skel-thumb::after,.yj-skel-line::after,.yj-skel-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.75) 50%,transparent 80%);
  background-size:300% 100%;
  animation:yj-shimmer 1.6s ease-in-out infinite;
}
.yj-skel:nth-child(2) *::after{animation-delay:.15s}
.yj-skel:nth-child(3) *::after{animation-delay:.3s}
.yj-skel:nth-child(4) *::after{animation-delay:.45s}
@keyframes yj-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 에러 ── */
.yj-error{padding:40px 20px;text-align:center;color:#aaa;font-size:14px;grid-column:1/-1}
.yj-error-icon{font-size:36px;margin-bottom:10px}

/* ── 반응형 ── */
@media(max-width:1024px){.yj-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .yj-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .yj-title{font-size:22px}
}
@media(max-width:420px){.yj-grid{grid-template-columns:1fr}}
</style>

<!-- HTML -->
<div class="yj-wrap">
  <!-- 로딩 프로그레스 바 -->
  <div class="yj-progress-bar yj-progress-loading" id="yj-progress"></div>

  <!-- LIVE 헤더 -->
  <div class="yj-header">
    <div class="yj-live-row">
      <div class="yj-live-badge">
        <span class="yj-live-dot"></span>LIVE
      </div>
      <div class="yj-new-badge">✦ NEW</div>
      <div class="yj-update-badge">🕐 6시간마다 자동 갱신</div>
    </div>
    <h2 class="yj-title">지금 뜨는 <span>추천 PC</span> 쇼츠</h2>
    <p class="yj-sub">
      <span class="yj-sub-dot"></span>
      유튜브 최신 쇼츠에서 실시간으로 불러온 추천 PC
    </p>
  </div>

  <!-- 그리드 (스켈레톤 → 실제 카드로 교체) -->
  <div class="yj-grid" id="yj-grid">
    <div class="yj-skel"><div class="yj-skel-video"></div><div class="yj-skel-info"><div class="yj-skel-thumb"></div><div class="yj-skel-lines"><div class="yj-skel-line"></div><div class="yj-skel-line w70"></div><div class="yj-skel-line w35"></div></div></div><div class="yj-skel-btn"></div></div>
    <div class="yj-skel"><div class="yj-skel-video"></div><div class="yj-skel-info"><div class="yj-skel-thumb"></div><div class="yj-skel-lines"><div class="yj-skel-line"></div><div class="yj-skel-line w70"></div><div class="yj-skel-line w35"></div></div></div><div class="yj-skel-btn"></div></div>
    <div class="yj-skel"><div class="yj-skel-video"></div><div class="yj-skel-info"><div class="yj-skel-thumb"></div><div class="yj-skel-lines"><div class="yj-skel-line"></div><div class="yj-skel-line w70"></div><div class="yj-skel-line w35"></div></div></div><div class="yj-skel-btn"></div></div>
    <div class="yj-skel"><div class="yj-skel-video"></div><div class="yj-skel-info"><div class="yj-skel-thumb"></div><div class="yj-skel-lines"><div class="yj-skel-line"></div><div class="yj-skel-line w70"></div><div class="yj-skel-line w35"></div></div></div><div class="yj-skel-btn"></div></div>
  </div>
</div>

<!-- JavaScript -->
<script>
(function () {
  var API_URL = 'https://yjmod-youtube.vercel.app/api/latest-shorts';
  var CACHE_KEY = 'yj_shorts_v2';
  var CACHE_TTL = 6 * 60 * 60 * 1000;

  function setProgress(done) {
    var bar = document.getElementById('yj-progress');
    if (!bar) return;
    if (done) {
      bar.classList.remove('yj-progress-loading');
      bar.classList.add('yj-progress-done');
      setTimeout(function () { bar.style.opacity = '0'; }, 600);
    }
  }

  function renderCards(data) {
    var grid = document.getElementById('yj-grid');
    if (!data || data.length === 0) {
      grid.innerHTML =
        '<div class="yj-error"><div class="yj-error-icon">📭</div>추천 PC 정보를 불러오지 못했습니다.</div>';
      return;
    }
    grid.innerHTML = '';
    data.forEach(function (item) {
      var card = document.createElement('div');
      card.className = 'yj-card';
      var targetLink = item.productLink || item.link;
      var thumb = item.productImage
        ? '<img src="' + item.productImage + '" alt="제품이미지" loading="lazy">'
        : '<div style="font-size:9px;color:#ccc;text-align:center;padding-top:16px;line-height:1.5">No<br>Image</div>';
      var embedSrc = 'https://www.youtube.com/embed/' + item.videoId
        + '?autoplay=1&mute=1&loop=1&playlist=' + item.videoId + '&rel=0&playsinline=1';
      card.innerHTML =
        '<div class="yj-video-wrap">' +
          '<iframe src="' + embedSrc + '" title="' + item.title + '"' +
          ' frameborder="0"' +
          ' allow="autoplay;accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture"' +
          ' allowfullscreen loading="lazy"></iframe>' +
          '<div class="yj-card-live"><span class="yj-card-live-dot"></span>LIVE</div>' +
          '<div class="yj-watermark">YJ MOD</div>' +
        '</div>' +
        '<div class="yj-prod-info">' +
          '<div class="yj-prod-thumb">' + thumb + '</div>' +
          '<div class="yj-prod-texts">' +
            '<div class="yj-prod-label">추천 PC</div>' +
            '<div class="yj-prod-title">' + item.productTitle + '</div>' +
            '<div class="yj-prod-price-label">최저가</div>' +
            '<div class="yj-prod-price">' + item.productPrice + '</div>' +
          '</div>' +
        '</div>' +
        '<a href="' + targetLink + '" target="_blank" class="yj-buy-btn">제품 바로가기 <span class="yj-buy-arrow">▶</span></a>';
      grid.appendChild(card);
    });
    setProgress(true);
  }

  function loadShorts() {
    try {
      var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && (Date.now() - cached.ts) < CACHE_TTL && cached.data && cached.data.length > 0) {
        renderCards(cached.data);
        return;
      }
    } catch (e) {}

    fetch(API_URL)
      .then(function (res) { if (!res.ok) throw new Error(); return res.json(); })
      .then(function (data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
        renderCards(data);
      })
      .catch(function () {
        setProgress(true);
        document.getElementById('yj-grid').innerHTML =
          '<div class="yj-error"><div class="yj-error-icon">⚠️</div>쇼츠 정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
      });
  }

  loadShorts();
})();
</script>
