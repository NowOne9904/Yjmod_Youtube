<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YJ Shorts Auto Loader</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="yj-shorts-container">
    <div class="yj-shorts-header">
        <h2>하이엔드 PC, 무이자로 부담없이!</h2>
        <p>24개월, 36개월 무이자로 부담없이 하이엔드 PC를 구매하세요!</p>
    </div>

    <div class="yj-shorts-grid" id="yj-shorts-grid">
        <!-- Load skeleton or spinner initially -->
        <p>최신 추천 PC 쇼츠를 불러오는 중입니다...</p>
    </div>
</div>

<script>
    // Vercel deployment URL will be used here later.
    // For now, testing with relative or localhost path if running NextJS server.
    const API_URL = '/api/latest-shorts'; 
    // In production embedded script, API_URL will be absolute like 'https://yj-shorts-api.vercel.app/api/latest-shorts'

    async function loadShorts() {
        const grid = document.getElementById('yj-shorts-grid');
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('API fetch failed');
            const data = await res.json();
            
            grid.innerHTML = ''; // Clear loading text

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'yj-short-card';
                
                // Format price a bit if needed (expecting scraped text to already have "원")
                const priceText = item.productPrice ? `<span class="price-val">${item.productPrice}</span>` : '가격 정보 없음';
                
                // Check if product link exists, else fallback to video link
                const targetLink = item.productLink || item.link;

                card.innerHTML = `
                    <div class="yj-video-wrapper">
                        <!-- We can embed iframe or just a clickable thumbnail.
                             Design shows autoplaying/short style, so we can use a muted loop iframe or high-res thumbnail.
                             For performance, large custom thumbnail overlaid with a play button or YouTube iframe. -->
                        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${item.videoId}?autoplay=0&mute=1&loop=1&playlist=${item.videoId}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                        <div class="yj-watermark">YJ MOD</div>
                    </div>
                    <div class="yj-product-info">
                        <div class="yj-product-thumb">
                            ${item.productImage ? `<img src="${item.productImage}" alt="${item.productTitle}">` : '<div class="no-img">No Image</div>'}
                        </div>
                        <div class="yj-product-texts">
                            <div class="yj-prod-label">제품명</div>
                            <div class="yj-prod-title">${item.productTitle}</div>
                            <div class="yj-prod-price">${priceText}</div>
                        </div>
                    </div>
                    <a href="${targetLink}" target="_blank" class="yj-buy-btn">
                        제품 바로가기 ▶
                    </a>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error(error);
            grid.innerHTML = '<p>쇼츠 정보를 불러오지 못했습니다.</p>';
        }
    }

    // Initialize
    loadShorts();
</script>

</body>
</html>
